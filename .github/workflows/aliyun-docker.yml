name: Build and Push to Aliyun Registry

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.6.11)'
        required: true
        default: 'v0.6.11'

jobs:
  build-and-push:
    name: Build and Push Docker Image to Aliyun
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # Strip leading 'v' for numeric version
          NUMERIC_VERSION="${VERSION#v}"
          echo "numeric_version=${NUMERIC_VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION} (numeric: ${NUMERIC_VERSION})"

      - name: Save version info
        run: |
          echo "${{ steps.version.outputs.numeric_version }}" > VERSION
          cat VERSION

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/fuzhengwei/one-api:${{ steps.version.outputs.numeric_version }}
            registry.cn-hangzhou.aliyuncs.com/fuzhengwei/one-api:latest
          labels: |
            org.opencontainers.image.title=one-api
            org.opencontainers.image.version=${{ steps.version.outputs.numeric_version }}
            org.opencontainers.image.description=One API - OpenAI API unified gateway with custom channel support

      - name: Image info
        run: |
          echo "✅ Docker image pushed successfully!"
          echo ""
          echo "Pull command:"
          echo "  docker pull registry.cn-hangzhou.aliyuncs.com/fuzhengwei/one-api:${{ steps.version.outputs.numeric_version }}"
          echo "  docker pull registry.cn-hangzhou.aliyuncs.com/fuzhengwei/one-api:latest"
          echo ""
          echo "Tag for local use:"
          echo "  docker tag registry.cn-hangzhou.aliyuncs.com/fuzhengwei/one-api:${{ steps.version.outputs.numeric_version }} fuzhengwei/one-api:${{ steps.version.outputs.numeric_version }}"
